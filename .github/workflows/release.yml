name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: releases
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Run quality gate
        run: npm run check

      - name: Resolve release tag
        id: version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "Release tag $TAG does not match manifest version $VERSION"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package extension and source ZIPs
        run: |
          mkdir -p build/extension
          cp manifest.json background.js LICENSE build/extension/
          cp -R content-scripts icons lib options popup profiles build/extension/
          (cd build/extension && zip -qr ../stealth-guard.zip .)
          git archive --format=zip --output=build/stealth-guard-source.zip "$GITHUB_SHA"
          unzip -t build/stealth-guard.zip
          unzip -t build/stealth-guard-source.zip

      - name: Decode extension signing key
        id: signing
        env:
          EXTENSION_KEY_B64: ${{ secrets.STEALTH_GUARD_EXTENSION_KEY_B64 }}
        run: |
          if [ -z "$EXTENSION_KEY_B64" ]; then
            echo "Signing key is not configured; publishing ZIP downloads only."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$EXTENSION_KEY_B64" | base64 --decode > extension-key.pem
          chmod 600 extension-key.pem
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Package signed CRX
        if: steps.signing.outputs.enabled == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          CHROME_PATH=$(node --input-type=module -e 'import { chromium } from "playwright-core"; process.stdout.write(chromium.executablePath())')
          test -x "$CHROME_PATH"
          xvfb-run --auto-servernum -- "$CHROME_PATH" \
            --no-sandbox \
            --disable-gpu \
            --no-message-box \
            --pack-extension="$GITHUB_WORKSPACE/build/extension" \
            --pack-extension-key="$GITHUB_WORKSPACE/extension-key.pem"
          mv build/extension.crx "build/stealth-guard-${RELEASE_TAG}.crx"
          node tools/generate-update-manifest.mjs \
            --key extension-key.pem \
            --manifest build/extension/manifest.json \
            --codebase "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/stealth-guard-${RELEASE_TAG}.crx" \
            --output build/updates.xml

      - name: Remove signing key
        if: always()
        run: rm -f extension-key.pem

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            build/*.zip
            ${{ steps.signing.outputs.enabled == 'true' && 'build/*.crx' || '' }}
            ${{ steps.signing.outputs.enabled == 'true' && 'build/updates.xml' || '' }}
          fail_on_unmatched_files: true
          generate_release_notes: true
