name: Bug report
description: Report a reproducible Stealth Guard problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Stealth Guard. Do not include cookies, proxy credentials, or other secrets.
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Opera, Other MV2-capable Chromium build, Unsupported current Chromium build]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Browser and extension versions
      placeholder: "Opera 1xx, Stealth Guard 1.x"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Describe the smallest reliable reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or sanitized logs if useful.
